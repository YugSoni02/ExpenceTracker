spring.application.name=Expense Tracker

# Local development database
spring.datasource.url=jdbc:h2:mem:expensedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false

# Development account. Set both environment variables to use a private account.
expense.tracker.user=${EXPENSE_TRACKER_USER:expense}
expense.tracker.password=${EXPENSE_TRACKER_PASSWORD:expense123}

# Keep operational endpoints deliberately limited; health details are not public.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

